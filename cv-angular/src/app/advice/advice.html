<section id="advice-section" class="mt-5 mb-5">
  <div class="card p-4 shadow-sm advice-card">
    <div class="card-body text-center">
      <h5 class="card-title text-primary mb-4">💡 Consejo del Día</h5>
      
      <div *ngIf="isLoading" class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>

      <p *ngIf="!isLoading" class="card-text fs-5">
        "{{ adviceQuote }}"
      </p>
    </div>
  </div>
</section>
