<button class="btn btn-primary mb-3" (click)="toggleExperience()">
  {{ showExperience ? 'Ocultar Experiencia Laboral' : 'Mostrar Experiencia Laboral' }}
</button> 

<section id="experience" *ngIf="showExperience"> 
  <h2 class="text-primary mt-4 mb-3">Experiencia Laboral</h2>

  <!-- Muestra un mensaje si el array está vacío -->
  <div *ngIf="experience.length === 0" class="alert alert-info">
    Cargando experiencias...
  </div>

  <table *ngIf="experience.length > 0" class="table table-striped table-hover">
    <thead>
      <tr>
        <th scope="col">Período</th>
        <th scope="col">Empresa</th>
        <th scope="col">Puesto</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let job of experience">
        <td>{{job.period}}</td>
        <td>{{job.company}}</td>
        <td>{{job.position}}</td>
      </tr>

    </tbody>
    <caption>Experiencia profesional de Ximena Díaz</caption>
  </table>
</section>
